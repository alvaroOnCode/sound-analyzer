<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>sound-analyzer</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cg fill='%23fff'%3E%3Crect x='3' y='6' width='2' height='4' rx='1'/%3E%3Crect x='7' y='3' width='2' height='10' rx='1'/%3E%3Crect x='11' y='5' width='2' height='6' rx='1'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar scroll-y">
        <a class="brand" href="#/browse">
          <span class="brand__mark" aria-hidden="true">
            <i style="height: 7px"></i><i style="height: 14px"></i><i style="height: 10px"></i>
          </span>
          sound-analyzer
        </a>

        <div class="library-card">
          <div class="library-card__path" id="library-path">Cargando…</div>
          <div class="library-card__stats" id="library-stats"></div>
        </div>

        <nav class="sidebar__section" aria-label="Navegación">
          <a class="nav-item" href="#/browse" data-nav="browse">
            <span class="nav-item__glyph" aria-hidden="true">◎</span>
            Explorar
          </a>
          <a class="nav-item" href="#/all" data-nav="all">
            <span class="nav-item__glyph" aria-hidden="true">≡</span>
            Todos los sonidos
            <span class="nav-item__count" id="nav-all-count"></span>
          </a>
        </nav>

        <section class="sidebar__section" aria-labelledby="cat-title">
          <h2 class="sidebar__title" id="cat-title">Categorías</h2>
          <ul id="category-nav"></ul>
        </section>

        <section class="sidebar__section" id="folder-section" aria-labelledby="folder-title" hidden>
          <h2 class="sidebar__title" id="folder-title">Carpetas</h2>
          <ul id="folder-nav"></ul>
        </section>
      </aside>

      <div class="content">
        <header class="topbar">
          <button class="icon-btn" id="nav-back" title="Atrás" aria-label="Atrás">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M10.3 2.3 4.6 8l5.7 5.7 1.1-1.1L6.8 8l4.6-4.6z" />
            </svg>
          </button>

          <form class="search" id="search-form" role="search">
            <span class="search__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path
                  d="M7 1a6 6 0 1 0 3.7 10.7l3.3 3.3 1.1-1.1-3.3-3.3A6 6 0 0 0 7 1zm0 1.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"
                />
              </svg>
            </span>
            <input
              class="search__input"
              id="search-input"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Busca por descripción: puerta de metal, perro ladrando, whoosh…"
              aria-label="Buscar sonidos"
            />
            <button class="search__clear" id="search-clear" type="button" title="Limpiar" aria-label="Limpiar">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="m8 6.9 4.3-4.3 1.1 1.1L9.1 8l4.3 4.3-1.1 1.1L8 9.1l-4.3 4.3-1.1-1.1L6.9 8 2.6 3.7l1.1-1.1z" />
              </svg>
            </button>
          </form>

          <div class="topbar__right">
            <div class="segmented" id="top-select" role="group" aria-label="Número de resultados">
              <button type="button" data-top="10">10</button>
              <button type="button" data-top="25" class="is-active">25</button>
              <button type="button" data-top="50">50</button>
            </div>
            <label class="pill pill--ghost pill--compact" for="ref-input" title="Buscar por audio de referencia">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 1a3 3 0 0 0-3 3v4a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                <path d="M3 7v1a5 5 0 0 0 4.25 4.94V15H5.5v1.5h5V15H8.75v-2.06A5 5 0 0 0 13 8V7h-1.5v1a3.5 3.5 0 1 1-7 0V7z" />
              </svg>
              Referencia
            </label>
            <input class="sr-only" id="ref-input" type="file" accept="audio/*" />
            <button class="pill pill--filled" id="search-submit" type="button">Buscar</button>
          </div>
        </header>

        <main class="main scroll-y" id="main" tabindex="-1"></main>
      </div>
    </div>

    <footer class="player is-empty" id="player">
      <div class="player__now">
        <div class="player__art" id="player-art"></div>
        <div class="player__meta">
          <div class="player__title truncate" id="player-title">Nada sonando</div>
          <div class="player__sub truncate" id="player-sub">Elige un sonido de la lista</div>
        </div>
      </div>

      <div class="player__center">
        <div class="player__controls">
          <button class="icon-btn" id="player-prev" title="Anterior" aria-label="Anterior">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M4 2h1.5v12H4zM13 2.6v10.8L5.5 8z" />
            </svg>
          </button>
          <button class="play-btn" id="player-toggle" title="Reproducir (espacio)" aria-label="Reproducir">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-icon="play">
              <path d="M4 2.6v10.8L13 8z" />
            </svg>
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
              data-icon="pause"
              style="display: none"
            >
              <path d="M3.5 2h3.2v12H3.5zM9.3 2h3.2v12H9.3z" />
            </svg>
          </button>
          <button class="icon-btn" id="player-next" title="Siguiente" aria-label="Siguiente">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M10.5 2H12v12h-1.5zM3 2.6v10.8L10.5 8z" />
            </svg>
          </button>
        </div>
        <div class="player__scrub">
          <span class="player__time" id="player-elapsed">0:00</span>
          <canvas class="player__wave" id="player-wave"></canvas>
          <span class="player__time player__time--end" id="player-total">0:00</span>
        </div>
      </div>

      <div class="player__right">
        <button class="toggle-btn" id="player-loop" title="Repetir" aria-label="Repetir" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path
              d="M4.5 3h7l-1.6-1.6L11 .3 14.7 4 11 7.7 9.9 6.6 11.5 5h-7A2.5 2.5 0 0 0 2 7.5V9H.5V7.5A4 4 0 0 1 4.5 3zm7 10h-7L6.1 14.6 5 15.7 1.3 12 5 8.3l1.1 1.1L4.5 11h7A2.5 2.5 0 0 0 14 8.5V7h1.5v1.5a4 4 0 0 1-4 4z"
            />
          </svg>
        </button>
        <button class="toggle-btn" id="player-download" title="Descargar" aria-label="Descargar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M7.25 1v7.19L4.53 5.47 3.47 6.53 8 11.06l4.53-4.53-1.06-1.06-2.72 2.72V1zM2.5 12.5h11V14h-11z" />
          </svg>
        </button>
        <button class="toggle-btn" id="player-reveal" title="Mostrar en el explorador" aria-label="Mostrar en el explorador">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M1.5 2.5h4.1l1.2 1.5h7.7v9.5h-13zm1.5 1.5v6.5h10V5.5H6.1L4.9 4z" />
          </svg>
        </button>
        <input
          class="volume"
          id="player-volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          title="Volumen"
          aria-label="Volumen"
        />
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
